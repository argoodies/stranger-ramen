<html><body><script>
const TAU = Math.PI * 2, N = 1024, C = N / 2, R = 500;
const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function disc(ctx) {      // the role token's own disc: tan rim, cream face
  ctx.beginPath(); ctx.arc(C, C, R, 0, TAU); ctx.fillStyle = css([206, 190, 160]); ctx.fill();
  ctx.beginPath(); ctx.arc(C, C, R * .88, 0, TAU); ctx.fillStyle = css([244, 232, 208]); ctx.fill();
}
// hand-drawn digits: thick rounded strokes, like the role tokens' emblems; each glyph in a box 0.62 wide, 1 tall
const GLYPH = {
  '0': c => { c.ellipse(.31, .5, .25, .44, 0, 0, TAU); },
  '1': c => { c.moveTo(.1, .24); c.quadraticCurveTo(.24, .16, .36, .04); c.lineTo(.36, .96); },
  '2': c => { c.moveTo(.06, .26); c.bezierCurveTo(.1, -.02, .58, -.02, .56, .3); c.bezierCurveTo(.54, .52, .22, .7, .06, .95); c.lineTo(.58, .95); },
  '3': c => { c.moveTo(.08, .14); c.bezierCurveTo(.24, -.03, .58, .03, .52, .27); c.bezierCurveTo(.48, .43, .32, .47, .22, .47);
              c.moveTo(.22, .47); c.bezierCurveTo(.66, .45, .64, .99, .3, .97); c.bezierCurveTo(.17, .97, .08, .91, .05, .84); },
  '5': c => { c.moveTo(.54, .05); c.lineTo(.15, .05); c.lineTo(.11, .45); c.bezierCurveTo(.32, .33, .6, .41, .58, .67); c.bezierCurveTo(.56, .97, .2, 1.02, .05, .86); },
  '7': c => { c.moveTo(.05, .05); c.lineTo(.58, .05); c.bezierCurveTo(.42, .3, .3, .6, .26, .95); },
};
function num(ctx, n, y, size, col, maxw = R * 1.05) {
  const adv = .62, gap = .12, w = n.length * adv + (n.length - 1) * gap;
  const h = Math.min(size * .74, maxw / w), lw = Math.max(h * .15, 24), x0 = C - w * h / 2, y0 = y - h / 2;
  ctx.save(); ctx.strokeStyle = css(col); ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  [...n].forEach((d, i) => {
    const tilt = [-.05, .04, -.03, .05][i % 4];      // each digit a touch off true, as if by hand
    ctx.save(); ctx.translate(x0 + i * (adv + gap) * h + adv * h / 2, y0 + h / 2); ctx.rotate(tilt); ctx.translate(-adv * h / 2, -h / 2); ctx.scale(h, h);
    ctx.beginPath(); GLYPH[d](ctx); ctx.restore(); ctx.stroke();
  });
  ctx.restore();
}
function leaf(ctx, x, y, ang, len, wid, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * .5, -wid, len, 0); ctx.quadraticCurveTo(len * .5, wid, 0, 0); ctx.fillStyle = css(col); ctx.fill(); ctx.restore();
}
const G1 = [184, 132, 36], G2 = [150, 104, 24], CRM = [244, 232, 208], RED = [206, 40, 62], BLU = [60, 130, 230];
function leaf2(ctx, x, y, ang, len, wid, mode) {      // a leaf; 'two': its lower half a darker gold; 'vein': a cream midrib
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * .5, -wid, len, 0); ctx.quadraticCurveTo(len * .5, wid, 0, 0); ctx.fillStyle = css(G1); ctx.fill();
  if (mode === 'two') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, 0); ctx.quadraticCurveTo(len * .5, wid, 0, 0); ctx.fillStyle = css(G2); ctx.fill(); }
  if (mode === 'vein') { ctx.beginPath(); ctx.moveTo(len * .18, 0); ctx.lineTo(len * .72, 0); ctx.strokeStyle = css(CRM); ctx.lineWidth = wid * .22; ctx.lineCap = 'round'; ctx.stroke(); }
  ctx.restore();
}
function branch(ctx, sgn, o) {      // one side of the wreath on an arc round (C, cy)
  const { cy, rr, a0s, a1s, k, lw, mode, both, berries } = o, a0 = Math.PI / 2 - sgn * a0s, a1 = Math.PI / 2 - sgn * a1s;
  ctx.strokeStyle = css(G1); ctx.lineCap = 'round'; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(C, cy, rr, a0, a1, sgn > 0); ctx.stroke();
  for (let i = 0; i < k; i++) { const u = i / (k - 1), a = a0 + (a1 - a0) * (.08 + .86 * u), x = C + Math.cos(a) * rr, y = cy + Math.sin(a) * rr, along = a - sgn * Math.PI / 2;
    const L = (o.L || 150) - 30 * u, Wd = (o.W || 62) - 10 * u;
    if (both) { if (i % 2) leaf2(ctx, x, y, along + sgn * .75, L, Wd, mode); else leaf2(ctx, x, y, along - sgn * .65, L * .9, Wd * .9, mode); }
    else leaf2(ctx, x, y, along + sgn * .75, L, Wd, mode);
    if (berries && i % 2 === 0 && i < k - 1) { const b = a + (a1 - a0) * .1, bx = C + Math.cos(b) * (rr - 46), by = cy + Math.sin(b) * (rr - 46); ctx.beginPath(); ctx.arc(bx, by, 20, 0, TAU); ctx.fillStyle = css(i % 4 ? BLU : RED); ctx.fill(); } }
  const ta = a1, tx = C + Math.cos(ta) * rr, ty = cy + Math.sin(ta) * rr; leaf2(ctx, tx, ty, ta - sgn * Math.PI / 2, (o.L || 150) * .7, (o.W || 62) * .74, mode);
}
function wins(ctx, n) {      // a laurel wreath in the tokens' manner: leaves on both sides of each stem, the two branches apart at the foot
  const o = { cy: C + 20, rr: R * .62, a0s: .66, a1s: 2.45, k: 7, lw: 30, both: true, L: 132, W: 54 };
  for (const sgn of [-1, 1]) branch(ctx, sgn, o);
  num(ctx, n, C + 4, 330, G1, R * .56);
}
function streak(ctx, n) {      // a flame in the middle of the token, the number inside it
  const col = [206, 40, 62], fh = 640, fw = 360, cx = C, by = C + fh * .42, ty = C - fh * .58;
  ctx.beginPath(); ctx.moveTo(cx, ty);
  ctx.bezierCurveTo(cx + fw * .08, ty + fh * .22, cx + fw * .62, ty + fh * .36, cx + fw * .62, ty + fh * .68);
  ctx.bezierCurveTo(cx + fw * .62, by - fh * .08, cx + fw * .32, by, cx, by);
  ctx.bezierCurveTo(cx - fw * .32, by, cx - fw * .62, by - fh * .08, cx - fw * .62, ty + fh * .68);
  ctx.bezierCurveTo(cx - fw * .62, ty + fh * .5, cx - fw * .4, ty + fh * .4, cx - fw * .3, ty + fh * .28);
  ctx.bezierCurveTo(cx - fw * .26, ty + fh * .4, cx - fw * .18, ty + fh * .44, cx - fw * .12, ty + fh * .45);
  ctx.bezierCurveTo(cx - fw * .16, ty + fh * .3, cx - fw * .08, ty + fh * .12, cx, ty);
  ctx.fillStyle = css(col); ctx.fill();
  // hollowed out: a cream inner flame, the number inside it in red
  const ih = fh * .56, iw = fw * .74, iby = by - fh * .06, ity = iby - ih;
  ctx.beginPath(); ctx.moveTo(cx, ity);
  ctx.bezierCurveTo(cx + iw * .1, ity + ih * .25, cx + iw * .62, ity + ih * .4, cx + iw * .62, ity + ih * .7);
  ctx.bezierCurveTo(cx + iw * .62, iby - ih * .1, cx + iw * .32, iby, cx, iby);
  ctx.bezierCurveTo(cx - iw * .32, iby, cx - iw * .62, iby - ih * .1, cx - iw * .62, ity + ih * .7);
  ctx.bezierCurveTo(cx - iw * .62, ity + ih * .4, cx - iw * .1, ity + ih * .25, cx, ity);
  ctx.fillStyle = css([244, 232, 208]); ctx.fill();
  num(ctx, n, iby - ih * .36, 260, col, iw * .62);
}
function day(ctx, n) {
  const col = [240, 168, 12], rr = R * .5;      // the sun's bright yellow
  ctx.lineCap = 'round'; ctx.strokeStyle = css(col);
  ctx.lineWidth = 34; ctx.beginPath(); ctx.arc(C, C, rr, 0, TAU); ctx.stroke();
  ctx.lineWidth = 40;
  for (let k = 0; k < 12; k++) { const a = k * TAU / 12, r1 = rr + 52, r2 = rr + (k % 2 ? 105 : 135);
    ctx.beginPath(); ctx.moveTo(C + Math.cos(a) * r1, C + Math.sin(a) * r1); ctx.lineTo(C + Math.cos(a) * r2, C + Math.sin(a) * r2); ctx.stroke(); }
  num(ctx, n, C + 4, 320, col, R * .7);
}
const KIND = { wins, streak, day }, out = {};
for (const [id, k, n] of JSON.parse(decodeURIComponent(location.hash.slice(1)))) {
  const c = document.createElement('canvas'); c.width = c.height = N; const ctx = c.getContext('2d'); disc(ctx); KIND[k](ctx, n); out[id] = c.toDataURL();
}
document.fonts.ready.then(() => { document.body.textContent = '@@' + JSON.stringify(out) + '@@'; });
</script></body></html>
