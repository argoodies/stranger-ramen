name: PocketClocktower
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
targets:
  PocketClocktower:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.argoodies
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PocketClocktower.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 9TGD35M5GT
        CODE_SIGN_STYLE: Automatic
