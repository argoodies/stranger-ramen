plugins { id 'com.android.application' }

// Thin WebView shell around assets/index.html (copied in by CI from the repo root).
android {
    namespace 'com.meloalright.ramenya'
    compileSdk 34

    defaultConfig {
        applicationId 'com.meloalright.ramenya'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '0.1.6'
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storeType 'pkcs12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'ramen'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
