server {
  listen 80;
  root /usr/share/nginx/html;
  # always revalidate so a refresh picks up the newest build
  add_header Cache-Control "no-cache, must-revalidate";

  # the site root answers with nothing at all; the playable web build lives at /web and nothing links to it
  location = / { return 204; }
  location = /web { try_files /game.html =404; }
  # /3b: the clock tower's three-player game on its own, round after round (built by tools/mk3b.py)
  location = /3b { try_files /3b.html =404; }
  location = /android { try_files /android.html =404; }
  location = /ios { try_files /ios.html =404; }
  location = /privacy { try_files /privacy.html =404; }
  location = /support { try_files /support.html =404; }
  # browsers ask for these by themselves; the game page at /web names no icon of its own
  location = /favicon.ico { default_type image/png; try_files /icon.png =404; }
  location = /apple-touch-icon.png { try_files /icon.png =404; }
  location = /apple-touch-icon-precomposed.png { try_files /icon.png =404; }
  location ~ \.apk$ {
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition 'attachment; filename="ramen-puzzle.apk"';
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location ~ \.hap$ {
    types { application/octet-stream hap; }
    add_header Content-Disposition 'attachment; filename="ramen-puzzle.hap"';
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
