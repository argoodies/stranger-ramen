canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.cell{aspect-ratio:1;border-radius:12px;background:rgba(20,16,50,.32);box-shadow:inset 0 2px 5px rgba(10,6,40,.45);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:400;position:relative}
.cell.sel{border-color:#ffe6a8;background:rgba(255,236,190,.2)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.act{padding:10px 20px;border-radius:22px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:14px}
.act.main{background:#ffe6a8;color:#3a2c5a;border-color:#ffe6a8;font-weight:400}
.act:disabled{opacity:.4}
.foc{outline:2px solid #ffe6a8;outline-offset:2px}
#detail{min-height:58px;text-align:center;font-size:13.5px;line-height:1.7;margin-top:12px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slots .cell{aspect-ratio:auto;height:62px;flex-direction:column;font-size:15px}.slots small{font-size:10.5px;opacity:.7;font-weight:300}
