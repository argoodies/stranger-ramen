<title>拉面怪奇物语 · 魔窟</title>
<style>

<script>
'use strict';
// 拉面怪奇物语 · 魔窟: the same little town, side on. A hunter and his crow; the tavern is home, the clock tower is the way down,

// ---------- save ----------

const stats = () => { const e = save.equip; return { dmg: 12 + (e.bow ? e.bow.dmg : 0), hp: 100 + (e.armor ? e.armor.hp : 0), spd: 5.6 * (1 + (e.acc ? e.acc.spd : 0)), sight: 6.5 + (e.acc ? e.acc.sight : 0) }; };

// ---------- sound ----------

const sfx = { shoot: () => tone(520, .12, 'triangle', .07, -300), hit: () => tone(180, .09, 'square', .05, -80), coin: () => { tone(990, .07, 'sine', .06); setTimeout(() => tone(1320, .1, 'sine', .06), 60); }, chest: () => { tone(330, .12, 'triangle', .08); setTimeout(() => tone(494, .14, 'triangle', .08), 90); setTimeout(() => tone(660, .2, 'triangle', .08), 190); }, hurt: () => tone(120, .18, 'sawtooth', .07, -50), out: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .24, 'sine', .07), i * 110)) };

// ---------- state ----------
const P = { x: 8, y: 0, vx: 0, vy: 0, face: 1, ground: true, hp: 100, inv: 0, draw: 0, aim: 0, step: 0, moved: 0, drop: 0 };
const crow = { x: 5, y: -5, state: 'fly', t: 0, flap: 0, dir: 1, shot: 0 };
let scene = 'tavern', cam = { x: 0, y: 0 }, time = 0, fade = 1, modal = false, shake = 0;
let run = null;      // the current trip into the cave
const floats = [];
const input = { l: 0, r: 0, up: false, down: false, shoot: false, joy: 0, mx: 0, my: 0, mouse: false, act: false };
function say(s, x, y, c = [255, 255, 255]) { floats.push({ s, x, y, c, t: 1.4 }); }

// ---------- tavern and town: a flat floor, side on ----------
const TAV = { w: 15, door: 13.4, bar: 4.6, chest: 8.6, board: 11 };
const TOWN = { w: 58, tavern: 9, stall: 22, lib: 32, tower: 45 };
const TREES = [2.6, 15.6, 17.4, 27.4, 38.6, 40.4, 53, 55.4], LAMPS = [14, 27, 39, 51];

function clockHands(x, y, r) { const d = new Date(), h = (d.getHours() % 12 + d.getMinutes() / 60) / 12 * TAU, m = d.getMinutes() / 60 * TAU; circ(x, y, r, [70, 54, 110]); circ(x, y, r * .86, [240, 232, 216]); line([[x, y], [x + Math.sin(h) * r * .46, y - Math.cos(h) * r * .46]], [60, 40, 90], r * .1); line([[x, y], [x + Math.sin(m) * r * .7, y - Math.cos(m) * r * .7]], [60, 40, 90], r * .07); }
function house(x, y, w, h, wall, roof, rh) {

function tree(x, y, k) { rect(x - k * .07, y - k * .5, k * .14, k * .5, [150, 110, 90]); for (const [z, w, c] of [[.4, .62, [70, 150, 130]], [.82, .5, [90, 170, 146]], [1.2, .36, [120, 190, 160]]]) poly([[x - w * k, y - z * k], [x, y - (z + .72) * k], [x + w * k, y - z * k]], c); }

}
function drawTown(t) {
  sky(t);
  const gy = H * .74, wx = x => (x - cam.x) * S + W / 2, k = S;
  // far hills, then the island's turf and its underside hanging over the sky
  for (const [o, c, h] of [[.15, [96, 86, 150], 2.4], [.35, [76, 110, 140], 1.5]]) { C.beginPath(); C.moveTo(0, gy); for (let x = 0; x <= W; x += 24) C.lineTo(x, gy - h * k * (.6 + .4 * Math.sin((x + cam.x * S * o) * .006) * Math.sin((x + cam.x * S * o) * .0031 + 2))); C.lineTo(W, gy); C.closePath(); C.fillStyle = css(c, .7); C.fill(); }

  rect(x0, gy, x1 - x0, k * .5, [108, 180, 170]); rect(x0, gy + k * .5, x1 - x0, k * .6, [72, 118, 134]); poly([[x0 + k, gy + k * 1.1], [x1 - k, gy + k * 1.1], [x1 - k * 7, gy + k * 2.6], [x0 + k * 7, gy + k * 2.6]], [52, 86, 112]);
  for (let x = 0; x < TOWN.w; x += 2) rect(wx(x) + 2, gy, k * 2 - 4, k * .14, [150, 206, 190]);

  // the tavern
  { const x = wx(TOWN.tavern); house(x, gy, k * 6, k * 3.2, [244, 190, 130], [226, 106, 96], k * 2); rect(x + k * 1.1, gy - k * 6.2, k * .6, k * 1.8, [190, 172, 164]); for (let i = 0; i < 3; i++) { const ph = (t * .3 + i / 3) % 1; circ(x + k * 1.4, gy - k * (6.3 + ph * 1.4), k * (.1 + .16 * ph), [240, 236, 240], .4 * (1 - ph)); } arch(x, gy, k * 1.1, k * 1.9, [255, 214, 140]); arch(x - k * 1.9, gy - k * 1.1, k * .8, k * 1, [255, 214, 140]); arch(x + k * 1.9, gy - k * 1.1, k * .8, k * 1, [255, 214, 140]); glow(x, gy - k * .8, k * 1.8, [255, 214, 140], .4); rect(x - k * 1.5, gy - k * 2.7, k * 3, k * .56, [60, 44, 84]); text('酒馆', x, gy - k * 2.42, k * .34, [255, 236, 190], 1, 'center', 300); }
  // the noodle stall, the library: closed tonight
  { const x = wx(TOWN.stall); house(x, gy, k * 3.4, k * 2, [238, 216, 186], [86, 66, 112], k * .5); for (let i = 0; i < 6; i++) rect(x - k * 1.8 + i * k * .6, gy - k * 1.7, k * .6, k * .46, i % 2 ? [255, 255, 255] : [226, 96, 96]); rect(x - k * 1.2, gy - k * 1.1, k * 2.4, k * .9, [255, 214, 140]); }
  { const x = wx(TOWN.lib); house(x, gy, k * 3, k * 4, [238, 216, 186], [226, 106, 96], k * 1.2); arch(x, gy, k * .9, k * 1.6, [255, 214, 140]); arch(x, gy - k * 2.3, k * .7, k * 1, [80, 66, 120]); }

  { const x = wx(TOWN.tower); rect(x - k * 2, gy - k * 1, k * 2, k, [226, 204, 178]); rect(x, gy - k, k * 2, k, [190, 170, 160]); rect(x - k * 1.3, gy - k * 8, k * 1.3, k * 7, [238, 216, 186]); rect(x, gy - k * 8, k * 1.3, k * 7, [196, 176, 166]); rect(x - k * 1.6, gy - k * 10.2, k * 1.6, k * 2.2, [246, 232, 214]); rect(x, gy - k * 10.2, k * 1.6, k * 2.2, [206, 186, 176]); clockHands(x, gy - k * 9.1, k * .84); rect(x - k * 1.9, gy - k * 10.5, k * 3.8, k * .3, [238, 216, 186]); poly([[x - k * 1.7, gy - k * 10.5], [x, gy - k * 13.2], [x, gy - k * 10.5]], [226, 106, 96]); poly([[x, gy - k * 10.5], [x, gy - k * 13.2], [x + k * 1.7, gy - k * 10.5]], [160, 74, 96]); line([[x, gy - k * 13.2], [x, gy - k * 14]], [246, 200, 120], k * .06); circ(x, gy - k * 14, k * .1, [246, 200, 120]); arch(x, gy, k * 1, k * 1.9, [255, 214, 140]); arch(x - k * .6, gy - k * 4.4, k * .4, k * .8, [255, 214, 140]); arch(x + k * .6, gy - k * 5.4, k * .4, k * .8, [255, 214, 140]); glow(x, gy - k * .8, k * 1.6 * (1 + .1 * Math.sin(t * 3)), [190, 150, 255], .5); towerHit = [x - k * 2, gy - k * 14, k * 4, k * 14]; }
  for (const x of LAMPS) lamp(wx(x), gy, k, t);

  return gy;
}
let towerHit = null;
function person(x, y, k, c, dir, ph) { const s = Math.sin(ph) * k * .1; line([[x - k * .08, y - k * .5], [x - k * .1 + s, y]], [60, 48, 90], k * .1); line([[x + k * .08, y - k * .5], [x + k * .1 - s, y]], [60, 48, 90], k * .1); poly([[x - k * .22, y - k * .46], [x + k * .22, y - k * .46], [x + k * .14, y - k * 1.1], [x - k * .14, y - k * 1.1]], c); circ(x, y - k * 1.28, k * .2, [255, 226, 200]); }
function drawTavern(t) {
  const k = S, gy = H * .74, wx = x => (x - cam.x) * S + W / 2, x0 = wx(0), x1 = wx(TAV.w), top = gy - k * 6.4;
  rect(0, 0, W, H, [30, 24, 56]);

  rect(x0, top, x1 - x0, k * .5, [78, 50, 66]); for (let i = 1; i < TAV.w; i += 3.4) rect(wx(i), top, k * .3, gy - top, [92, 58, 66]);
  rect(x0, gy, x1 - x0, k * .24, [78, 50, 66]); rect(x0, gy + k * .24, x1 - x0, H - gy, [52, 36, 62]);
  // window with the moon, hanging lamps
  { const x = wx(2.2); rect(x - k, top + k * 1.4, k * 2, k * 1.8, [40, 44, 96]); circ(x + k * .4, top + k * 1.95, k * .3, [252, 244, 220]); rect(x - k * .04, top + k * 1.4, k * .08, k * 1.8, [78, 50, 66]); rect(x - k, top + k * 2.26, k * 2, k * .08, [78, 50, 66]); }
  for (const x of [6.6, 10.4]) { line([[wx(x), top + k * .5], [wx(x), top + k * 1.6]], [60, 40, 66], 2); circ(wx(x), top + k * 1.7, k * .17, [255, 226, 160]); glow(wx(x), top + k * 1.7, k * 3, [255, 206, 130], .5); }
  // the bar and the keeper
  { const x = wx(TAV.bar); person(x, gy - k * .1, k * 1.05, [90, 120, 170], 1, 0); rect(x - k * 2.4, gy - k * 1.1, k * 4.8, k * 1.1, [92, 56, 56]); rect(x - k * 2.6, gy - k * 1.26, k * 5.2, k * .18, [170, 110, 80]); for (let i = 0; i < 4; i++) { rect(x - k * 2 + i * k * 1.3, gy - k * 2.9, k * .18, k * .5, [[120, 200, 160], [226, 106, 96], [255, 214, 140], [140, 150, 230]][i]); } rect(x - k * 2.4, gy - k * 2.42, k * 4.8, k * .1, [78, 50, 66]); }

const ACT = {

$('bagBtn').addEventListener('click', () => { if (modal) return; sel = null; panelBag(); });

// ---------- the frame ----------
let last = performance.now(), dtNow = 1 / 60;

    drawHunter(wx, wy, t); drawCrow(wx, wy, t); drawFloats(wx, wy);

    if (scene === 'tavern' && save.runs === 0 && !modal) text(touch ? '左边滑动走路 · 到门口点“出门”' : 'A / D 走路 · E 互动 · B 背包', W / 2, H * .9, 14, [255, 255, 255], .75);
