<title>星穹十字小镇 · iOS 内测版</title>
<link rel="icon" href="/icon.png">
<style>
:root{--serif:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",Georgia,serif;--thin:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei UI",sans-serif;--cream:#f4ecdc;--gold:#ffe6aa}
*{box-sizing:border-box}
html{background:rgb(18,18,46)}
html,body{margin:0}
body{min-height:100vh;color:var(--cream);font-family:var(--thin);font-weight:300;-webkit-font-smoothing:antialiased;}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
a{color:var(--gold)}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
.icon{width:120px;height:120px;border-radius:27px;box-shadow:0 14px 44px rgba(8,6,28,.55);background:#18163c;color:transparent;overflow:hidden}
.thin{font-family:var(--thin);font-weight:200}
h1{font:200 clamp(34px,9vw,60px) var(--thin);letter-spacing:.22em;margin:26px 0 8px .22em;text-shadow:0 4px 22px rgba(8,6,28,.5)}
.sub{font:300 13px var(--thin);letter-spacing:.5em;margin:0 0 0 .5em;opacity:.8}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0;opacity:.6}
.rule i{display:block;width:46px;height:1px;background:#fff}.rule b{display:block;width:7px;height:7px;background:#fff;transform:rotate(45deg)}
.btn{display:inline-block;padding:15px 34px;border-radius:999px;font-size:17px;letter-spacing:.14em;text-decoration:none;color:#2b2140;background:#f0e2c6;box-shadow:0 5px 0 #b9a888,0 16px 34px rgba(8,6,28,.35);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b9a888}
.btn small{display:block;margin-top:5px;font-size:12px;letter-spacing:.04em;opacity:.62}
.chip{display:inline-block;padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);font:300 13px var(--thin);letter-spacing:.14em;opacity:.8}
footer{padding:44px 24px calc(40px + env(safe-area-inset-bottom));text-align:center;font:300 12.5px var(--thin);letter-spacing:.1em;color:rgba(255,250,230,.7)}
footer a{color:rgba(255,250,230,.7);text-decoration:none;border-bottom:1px solid rgba(255,250,230,.3);margin:0 8px}

html,body{overscroll-behavior:none}
main{min-height:100vh;min-height:100svh;max-width:460px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) 24px 0;text-align:center;display:flex;flex-direction:column;align-items:center}
.top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0 26px}
.btn.dl{display:block;width:100%;max-width:340px}.btn.dl small{white-space:nowrap;font-size:11.5px;letter-spacing:.02em}
footer{color:rgba(255,250,230,.7);padding-top:34px}
#wx{display:none;position:fixed;inset:0;z-index:99;background:rgba(10,8,30,.86);color:#f4ecdc;font-family:var(--thin);text-align:center}#wx.on{display:block}#wx svg{position:absolute;top:calc(6px + env(safe-area-inset-top));right:18px}#wx .msg{position:absolute;top:calc(118px + env(safe-area-inset-top));left:24px;right:24px;font:300 17px/1.9 var(--thin);letter-spacing:.06em}#wx .msg b{font-weight:400;color:#ffe6aa}#wx .msg small{display:block;margin-top:10px;font-size:13px;opacity:.7;letter-spacing:.02em}
.btn.tf{display:block;text-align:center;letter-spacing:.08em}.btn.tf .l1{display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.meteors{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}main{position:relative;z-index:1}h1{position:relative;display:inline-block}html,body{overflow-x:hidden}.meteor{position:absolute;left:calc(100% - .05em);top:-.35em;width:150px;height:1.6px;border-radius:2px;background:linear-gradient(90deg,rgba(255,250,235,1),rgba(255,250,235,0));transform:rotate(-35deg);transform-origin:left center}.meteor::before{content:'';position:absolute;left:-2px;top:-2px;width:5.6px;height:5.6px;border-radius:50%;background:#fffaf0;box-shadow:0 0 10px 3px rgba(255,240,200,.7)}
/* an iOS-style glass card: app icon, title and subtitle, a grey "open" pill with blue text */
.tfcard{display:flex;align-items:center;gap:12px;width:100%;max-width:360px;box-sizing:border-box;padding:12px 14px;border-radius:22px;text-decoration:none;text-align:left;
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid rgba(255,255,255,.28);box-shadow:0 10px 30px rgba(8,6,28,.28);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;letter-spacing:0;transition:transform .12s}
.tfcard:active{transform:scale(.98)}
.tfi{width:52px;height:52px;flex:none;border-radius:22.5%;box-shadow:0 0 0 .5px rgba(0,0,0,.12)}
.tft{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tft b{font-weight:600;font-size:16px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tft small{font-size:13px;color:rgba(255,255,255,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tfo{flex:none;padding:6px 18px;border-radius:999px;background:rgba(242,242,247,.92);color:#007aff;font-weight:600;font-size:15px}
.moon{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle 150px at 80% 13vh,rgba(236,196,132,.1) 0,rgba(236,196,132,0) 100%)}.moon svg{position:absolute;left:calc(80% - 26px);top:calc(13vh - 26px)}main{position:relative;z-index:1}
</style>

var mx=W*.8,my=H*.13,i,s,m;for(i=0;i<S.length;i++){s=S[i];m=Math.min(1,Math.max(0,(Math.hypot(s[0]-mx,s[1]-my)-100)/110));if(m>0){x.fillStyle='rgba(255,250,230,'+m*(.25+.35*(.5+.5*Math.sin(t*1.3+s[3])))+')';x.beginPath();x.arc(s[0],s[1],s[2],0,T);x.fill()}}requestAnimationFrame(draw)}
addEventListener('resize',size);size();requestAnimationFrame(draw)})()</script>
