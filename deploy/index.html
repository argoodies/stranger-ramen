<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>拉面怪奇物语</title>
<style>
:root{--serif:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif}
html,body{margin:0;height:100%;background:#0e0c24;overflow:hidden;touch-action:none;font-family:var(--serif);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;z-index:3}
#top>*{pointer-events:auto}
.pill{background:rgba(30,24,60,.62);color:#f4ecdc;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 14px;font:15px var(--serif);letter-spacing:.12em;backdrop-filter:blur(4px)}
button.pill{cursor:pointer}
button.pill:active{transform:scale(.96)}
button.pill.hint{animation:pillpulse 1.2s ease-in-out infinite;border-color:rgba(255,236,170,.9)}
@keyframes pillpulse{50%{box-shadow:0 0 0 5px rgba(255,236,170,.55)}}
#coins{letter-spacing:.06em}
#ui{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(12px + env(safe-area-inset-bottom));display:none;z-index:3}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:0 auto}
button.act{appearance:none;border:0;border-radius:14px;padding:13px 0;font:17px var(--serif);letter-spacing:.1em;color:#2b2140;background:#f0e2c6;box-shadow:0 4px 0 #b9a888;cursor:pointer;transition:transform .08s,opacity .2s,background .2s}
button.act:active{transform:translateY(3px);box-shadow:0 1px 0 #b9a888}
button.act:disabled{opacity:.28;box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:default}
button.act.c1{background:#f4c98a;box-shadow:0 4px 0 #b98f58}
button.act.c2{background:#ef8a80;box-shadow:0 4px 0 #a9524c;color:#3a1016}
button.act.c3{background:#9fd7a8;box-shadow:0 4px 0 #5f9a6c}
button.act.c4{background:#c79a7c;box-shadow:0 4px 0 #86604a}
button.act.c5{background:#8fd0cc;box-shadow:0 4px 0 #4f8f92}
button.act.hint{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 #b9a888,0 0 0 4px rgba(255,236,170,.75)}}
#dump{display:block;margin:8px auto 0;font-size:13px;padding:6px 14px}
#enter{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;z-index:3;font-size:17px;padding:12px 26px;background:rgba(228,96,88,.92);border-color:rgba(255,220,200,.6)}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16vh;color:#fff;z-index:5;cursor:pointer;background:linear-gradient(rgba(14,12,36,.55),rgba(14,12,36,0) 46%)}
#title h1{font:700 min(11.5vw,72px) var(--serif);letter-spacing:.14em;margin:0 0 0 .14em;white-space:nowrap;text-shadow:0 4px 18px rgba(20,10,40,.8)}
#title p{font:16px var(--serif);letter-spacing:.42em;margin:14px 0 0 .42em;opacity:.85}
#title .go{position:absolute;bottom:calc(9vh + env(safe-area-inset-bottom));padding:12px 30px;font-size:18px;letter-spacing:.3em;animation:breath 2s ease-in-out infinite}
@keyframes breath{50%{opacity:.55}}
#leave,#enter{display:none!important}
#err{position:fixed;left:0;top:0;right:0;color:#ff8;background:#600;font:12px monospace;z-index:9;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div style="display:flex;gap:8px">
    <button class="pill" id="leave" style="display:none">← 离开</button>
    <button class="pill" id="zoom" style="display:none;padding:8px 11px;line-height:0" aria-label="全景"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
  </div>
  <div style="display:flex;gap:8px">
    <button class="pill" id="mute">♪</button>
  </div>
</div>
<button class="pill" id="enter">进入拉面档口</button>
<div id="title"><h1>拉面怪奇物语</h1><p>STRANGER RAMEN</p></div>
<div id="err"></div>
<script>
'use strict';
window.onerror = (m, s, l, c) => { document.getElementById('err').textContent += m + ' @' + l + ':' + c + '\n'; };
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  starCache = null;
}
window.addEventListener('resize', resize);

// ------------------------------------------------------------ helpers
const TAU = Math.PI * 2, C30 = Math.cos(Math.PI / 6);
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const eout = t => 1 - Math.pow(1 - clamp(t), 3);
const pop = p => { p = clamp(p); if (p <= 0) return 0; const q = p - 1, s = 2.2; return q * q * ((s + 1) * q + s) + 1; };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const WHITE = [246, 241, 232], SKIN = [246, 226, 206], DARK = [70, 52, 92];
let TINT = [40, 30, 96], TK = 0.16, SHADOW = [58, 40, 96];
const tint = c => TK ? mix(c, TINT, TK) : c;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

function poly(pts, c, a = 1) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  const s = css(c, a); ctx.fillStyle = s; ctx.fill();
  if (a >= 1) { ctx.strokeStyle = s; ctx.lineWidth = 0.8; ctx.stroke(); }
}
function circ(x, y, r, c, a = 1) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fillStyle = css(c, a); ctx.fill(); }
function ell(x, y, rx, ry, c, a = 1) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, TAU); ctx.fillStyle = css(c, a); ctx.fill(); }
function line(pts, c, w, a = 1) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.strokeStyle = css(c, a); ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
function glow(x, y, r, c, st = 1) {
  if (r <= 0 || st <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, css(c, 0.55 * clamp(st))); g.addColorStop(1, css(c, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const FONT = (px, bold) => `${bold ? '700 ' : ''}${px}px "Noto Serif SC","Songti SC","STSong",serif`;
function text(t, x, y, px, c = [255, 255, 255], a = 1, align = 'center', bold = false) {
  ctx.font = FONT(px, bold); ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = css(c, a); ctx.fillText(t, x, y);
}

// ------------------------------------------------------------ iso view
class View {
  constructor(cx, cy, s) { this.cx = cx; this.cy = cy; this.s = s; }
  P(x, y, z = 0) { return [this.cx + (x - y) * this.s * C30, this.cy + (x + y) * this.s * 0.5 - z * this.s]; }
  inv(sx, sy) { const u = (sx - this.cx) / (this.s * C30), w = (sy - this.cy) / (this.s * 0.5); return [(u + w) / 2, (w - u) / 2]; }
  sh(c) { return [tint(mix(c, [255, 255, 255], 0.22)), tint(mix(c, SHADOW, 0.10)), tint(mix(c, SHADOW, 0.36))]; }
  F(pl, o, u, w) { return pl === 'L' ? this.P(o[0] + u, o[1], o[2] + w) : this.P(o[0], o[1] - u, o[2] + w); }
  box(x, y, z, dx, dy, dz, c, a = 1) {
    if (a <= 0) return; const [ct, cl, cr] = this.sh(c), P = this.P.bind(this);
    poly([P(x, y + dy, z), P(x + dx, y + dy, z), P(x + dx, y + dy, z + dz), P(x, y + dy, z + dz)], cl, a);
    poly([P(x + dx, y, z), P(x + dx, y + dy, z), P(x + dx, y + dy, z + dz), P(x + dx, y, z + dz)], cr, a);
    poly([P(x, y, z + dz), P(x + dx, y, z + dz), P(x + dx, y + dy, z + dz), P(x, y + dy, z + dz)], ct, a);
  }
  pyramid(x, y, z, w, h, c) {
    const [, cl, cr] = this.sh(c), P = this.P.bind(this), ap = P(x + w / 2, y + w / 2, z + h);
    poly([P(x, y + w, z), P(x + w, y + w, z), ap], cl); poly([P(x + w, y, z), P(x + w, y + w, z), ap], cr);
  }
  disc(x, y, z, r, h, c, a = 1) {
    const [ct, cl, cr] = this.sh(c), pt = (q, zz) => this.P(x + r * Math.cos(q), y + r * Math.sin(q), zz);
    if (h > 0) for (const [a0, a1, col] of [[-45, 45, cr], [45, 135, cl]]) {
      const up = [], dn = [];
      for (let i = 0; i <= 12; i++) { const q = (a0 + (a1 - a0) * i / 12) * Math.PI / 180; up.push(pt(q, z + h)); dn.unshift(pt(q, z)); }
      poly(up.concat(dn), col, a);
    }
    const top = []; for (let i = 0; i < 40; i++) top.push(pt(TAU * i / 40, z + h)); poly(top, ct, a);
  }
  quad(x, y, z, dx, dy, c, a = 1) { const P = this.P.bind(this); poly([P(x, y, z), P(x + dx, y, z), P(x + dx, y + dy, z), P(x, y + dy, z)], c, a); }
  arch(pl, o, w, h, c, a = 1) {
    const pts = [[-w / 2, 0], [w / 2, 0], [w / 2, h]];
    for (let i = 0; i <= 10; i++) { const q = Math.PI * i / 10; pts.push([w / 2 * Math.cos(q), h + w / 2 * Math.sin(q)]); }
    poly(pts.map(p => this.F(pl, o, p[0], p[1])), c, a);
  }
  clock(pl, o, r, ah, am) {
    const ring = rr => { const p = []; for (let i = 0; i < 36; i++) { const q = TAU * i / 36; p.push(this.F(pl, o, rr * Math.cos(q), rr * Math.sin(q))); } return p; };
    poly(ring(r), tint(DARK)); poly(ring(r * 0.86), tint([250, 240, 218]));
    for (let i = 0; i < 12; i++) { const q = TAU * i / 12; line([this.F(pl, o, r * .68 * Math.sin(q), r * .68 * Math.cos(q)), this.F(pl, o, r * .8 * Math.sin(q), r * .8 * Math.cos(q))], tint(DARK), this.s * 0.03); }
    const c0 = this.F(pl, o, 0, 0);
    line([c0, this.F(pl, o, r * .46 * Math.sin(ah), r * .46 * Math.cos(ah))], [60, 40, 80], this.s * 0.07);
    line([c0, this.F(pl, o, r * .72 * Math.sin(am), r * .72 * Math.cos(am))], [60, 40, 80], this.s * 0.045);
  }
}

// ------------------------------------------------------------ figures
function fig(x, y, k, o = {}) {
  const body = o.body || WHITE, head = o.head || SKIN, a = o.a == null ? 1 : o.a, kind = o.kind || 'ida', lean = o.lean || 0, shade = [70, 50, 110];
  if (a <= 0 || k <= 0) return;
  ell(x, y, .36 * k, .10 * k, [20, 12, 40], 0.3 * a);
  const ax = x + lean * k, ay = y - .95 * k;
  const bl = mix(body, [255, 255, 255], .12), br = mix(body, shade, .26);
  const hat = o.hat || body, hl = mix(hat, [255, 255, 255], .12), hd = mix(hat, shade, .26);
  const demon = kind === 'demon';
  if (demon) {
    const tl = []; for (let i = 0; i <= 8; i++) { const u = i / 8; tl.push([x + (.18 + .5 * u) * k, y - (.06 + .5 * u * u) * k]); }
    line(tl, hd, Math.max(2, .05 * k), a); const e = tl[8];
    poly([[e[0] - .08 * k, e[1] + .02 * k], [e[0] + .09 * k, e[1] - .02 * k], [e[0] + .06 * k, e[1] - .17 * k]], hd, a);
  }
  poly([[x - .30 * k, y], [x, y + .06 * k], [ax, ay]], bl, a);
  poly([[x, y + .06 * k], [x + .30 * k, y], [ax, ay]], br, a);
  if (o.apron) poly([[x - .16 * k, y - .08 * k], [x + .16 * k, y - .08 * k], [x + .09 * k, y - .55 * k], [x - .09 * k, y - .55 * k]], o.apron, a);
  const hx = ax + lean * .2 * k, hy = ay - .06 * k, hr = .17 * k;
  if (kind === 'crow') {
    poly([[hx - hr * .5, hy - .05 * k], [hx - hr * 2.3, hy + .05 * k], [hx - hr * .5, hy + .09 * k]], [240, 170, 70], a);
    circ(hx, hy, hr, body, a); circ(hx - hr * .35, hy - hr * .15, hr * .2, [250, 250, 250], a); return;
  }
  const hair = [44, 24, 52];
  if (kind === 'scarlet') for (const sg of [-1, 1])
    poly([[hx + sg * hr * .7, hy - hr * .4], [hx + sg * hr * 1.3, hy - hr * .2], [hx + sg * hr * 1.5, hy + hr * 1.7], [hx + sg * hr * .85, hy + hr * 1.5]], hair, a);
  circ(hx, hy, hr, head, a);
  if (kind === 'scarlet') {
    ctx.beginPath(); ctx.ellipse(hx, hy - hr * .5, hr * 1.3, hr * .85, 0, Math.PI, TAU); ctx.fillStyle = css(hair, a); ctx.fill();
    ell(hx, hy + hr * .5, hr * .42, hr * .2, [226, 18, 48], a); circ(hx + hr * 1.25, hy - hr * .85, hr * .3, [226, 18, 48], a);
  }
  if (kind === 'ida' || kind === 'ft') {
    const tip = [hx + lean * .3 * k, hy - .66 * k];
    poly([[hx - .21 * k, hy - .08 * k], [hx, hy - .04 * k], tip], hl, a); poly([[hx, hy - .04 * k], [hx + .21 * k, hy - .08 * k], tip], hd, a);
    if (kind === 'ft') { const sx = hx, sy = hy - .24 * k, r = .055 * k; poly([[sx, sy - r * 1.4], [sx + r, sy], [sx, sy + r * 1.4], [sx - r, sy]], [255, 220, 120], a); }
  } else if (demon) {
    for (const sg of [-1, 1]) poly([[hx + sg * .05 * k, hy - .13 * k], [hx + sg * .17 * k, hy - .06 * k], [hx + sg * .27 * k, hy - .40 * k]], sg < 0 ? hl : hd, a);
  } else if (kind === 'teller') {
    poly([[hx - .30 * k, hy - .10 * k], [hx + .30 * k, hy - .10 * k], [hx + .30 * k, hy - .15 * k], [hx - .30 * k, hy - .15 * k]], hd, a);
    poly([[hx - .16 * k, hy - .15 * k], [hx, hy - .15 * k], [hx, hy - .50 * k], [hx - .16 * k, hy - .50 * k]], hl, a);
    poly([[hx, hy - .15 * k], [hx + .16 * k, hy - .15 * k], [hx + .16 * k, hy - .50 * k], [hx, hy - .50 * k]], hd, a);
  } else if (kind === 'chef') {
    ctx.fillStyle = css([250, 250, 255], a);
    for (const [dx, dy, r] of [[-.11, -.3, .11], [.11, -.3, .11], [0, -.37, .13]]) { ctx.beginPath(); ctx.arc(hx + dx * k, hy + dy * k, r * k, 0, TAU); ctx.fill(); }
    poly([[hx - .15 * k, hy - .28 * k], [hx + .15 * k, hy - .28 * k], [hx + .14 * k, hy - .1 * k], [hx - .14 * k, hy - .1 * k]], [226, 228, 244], a);
    poly([[hx - .19 * k, hy - .14 * k], [hx + .19 * k, hy - .14 * k], [hx + .19 * k, hy - .08 * k], [hx - .19 * k, hy - .08 * k]], [220, 80, 80], a);
  }
}
const HATS = [[90, 150, 230], [240, 190, 110], [150, 200, 160], [200, 160, 220], [236, 130, 120], [90, 200, 180], [120, 180, 220]];
function randomLook() {
  const r = Math.random();
  if (r < 0.10) return { kind: 'crow', body: [52, 44, 86], name: '乌鸦' };
  if (r < 0.18) return { kind: 'teller', body: [132, 100, 172], hat: [70, 52, 100], name: '说书人' };
  if (r < 0.26) return { kind: 'demon', body: [222, 52, 66], head: [246, 170, 150], name: '小恶魔' };
  if (r < 0.34) return { kind: 'scarlet', body: [196, 30, 64], hat: [222, 52, 66], name: '红唇女郎' };
  if (r < 0.44) return { kind: 'ft', hat: [70, 100, 220], name: '占卜师' };
  return { kind: 'ida', hat: pick(HATS), name: '镇民' };
}

// ------------------------------------------------------------ audio
let AC = null, bus, master, muted = false, nextBar = 0, barIdx = 0, boilGain = null, mode = 'title';
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.85; master.connect(AC.destination);
    const conv = AC.createConvolver(), len = (AC.sampleRate * 3) | 0, buf = AC.createBuffer(2, len, AC.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / AC.sampleRate / 0.8); }
    conv.buffer = buf; const wet = AC.createGain(); wet.gain.value = 0.5;
    bus = AC.createGain(); bus.connect(master); bus.connect(conv); conv.connect(wet); wet.connect(master);
    const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.8;
    boilGain = AC.createGain(); boilGain.gain.value = 0; ns.connect(bp); bp.connect(boilGain); boilGain.connect(master); ns.start();
    nextBar = AC.currentTime + 0.1;
  } catch (e) { AC = null; }
}
function tone(f, t, dur, vol, type = 'sine') {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.05);
}
function chime(m, when = 0, vol = 0.2, dec = 1.6) {
  if (!AC) return; const t = AC.currentTime + when, f = mtof(m);
  tone(f, t, dec, vol); tone(2 * f, t, dec * 0.45, vol * 0.3); tone(4.2 * f, t, 0.12, vol * 0.12);
}
function bell(f, vol = 0.22) {
  if (!AC) return; const t = AC.currentTime;
  for (const [r, a, d] of [[0.5, .55, 4.5], [1, 1, 3.4], [1.19, .55, 2.6], [1.5, .32, 2], [2, .45, 1.5], [2.74, .22, 1], [4.07, .1, .45]]) tone(f * r, t, d, vol * a);
}
function pad(notes, t, dur) {
  for (const m of notes) for (const det of [1.0035, 0.9965]) {
    const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = mtof(m) * det;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.028, t + 2.4); g.gain.setValueAtTime(0.028, t + dur - 2.6); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.1);
  }
}
const MUSIC = {
