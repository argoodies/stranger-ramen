name: HarmonyOS HAP

# Wraps index.html in a HarmonyOS NEXT shell (harmony/: a full-screen Web component, like the Android WebView shell),
# builds it with Huawei's Command Line Tools, signs it, and publishes the .hap as a GitHub release asset.
#
# Secrets:
#   HARMONY_CLT_URL         direct archive link of "Command Line Tools for HarmonyOS" (Linux x64) copied from the Huawei
#                           download center after logging in; the link itself is long-lived. The unpacked tools are cached.
#   HARMONY_P12_B64         base64 of the .p12 key store                      (signing: from AppGallery Connect)
#   HARMONY_CER_B64         base64 of the .cer certificate
#   HARMONY_P7B_B64         base64 of the .p7b profile (bundle com.meloalright.ramenya)
#   HARMONY_KEY_ALIAS, HARMONY_KEY_PASSWORD, HARMONY_STORE_PASSWORD
# Without the signing secrets the build still runs and publishes an unsigned .hap (only good for checking the build).
on:
  workflow_dispatch:
    inputs:
      clt_url:
        description: "Command Line Tools archive URL (overrides the HARMONY_CLT_URL secret)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  hap:
    name: Build HAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Command Line Tools source
        id: clt
        env:
          IN_URL: ${{ inputs.clt_url }}
          SECRET_URL: ${{ secrets.HARMONY_CLT_URL }}
        run: |
          URL="${IN_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then echo "::error::No Command Line Tools URL: set the HARMONY_CLT_URL secret or the clt_url input"; exit 1; fi
          echo "$URL" > "$RUNNER_TEMP/clt_url"
          # cache key from the file name only (the query string carries a signature that may change between copies)
          NAME=$(basename "${URL%%\?*}")
          echo "key=harmony-clt-$NAME" >> "$GITHUB_OUTPUT"

      - name: Restore Command Line Tools
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/clt
          key: ${{ steps.clt.outputs.key }}

      - name: Download Command Line Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          mkdir -p ~/clt
          curl -fL --retry 3 -o "$RUNNER_TEMP/clt.zip" "$(cat "$RUNNER_TEMP/clt_url")"
          unzip -q "$RUNNER_TEMP/clt.zip" -d ~/clt
          rm "$RUNNER_TEMP/clt.zip"
          du -sh ~/clt

      - name: Cache Command Line Tools
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/clt
          key: ${{ steps.clt.outputs.key }}

      - name: Build
        env:
          RUN: ${{ github.run_number }}
        run: |
          set -eo pipefail
          CLT=$(find ~/clt -maxdepth 2 -type d -name command-line-tools | head -1); CLT=${CLT:-$HOME/clt}
          echo "tools: $CLT"; ls "$CLT"; ls "$CLT/bin" || true
          export PATH="$CLT/bin:$CLT/ohpm/bin:$CLT/hvigor/bin:$CLT/tool/node/bin:$PATH"
          which ohpm hvigorw node; node -v
          export DEVECO_SDK_HOME="$CLT/sdk"
          echo "CLT=$CLT" >> "$GITHUB_ENV"
          # the game itself, and the version: name from the Android build, code from the run number
          mkdir -p harmony/entry/src/main/resources/rawfile
          cp index.html harmony/entry/src/main/resources/rawfile/index.html
          VER=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)
          sed -i "s/\"versionName\": \".*\"/\"versionName\": \"$VER\"/; s/\"versionCode\": [0-9]*/\"versionCode\": $((1000000 + RUN))/" harmony/AppScope/app.json5
          cat harmony/AppScope/app.json5
          cd harmony
          ohpm install --all
          hvigorw --mode module -p module=entry@default -p product=default -p buildMode=release assembleHap --no-daemon --stacktrace
          find entry/build -name '*.hap' -print
          cp "$(find entry/build -name '*.hap' | head -1)" "$RUNNER_TEMP/unsigned.hap"

      - name: Sign
        id: sign
        env:
          P12: ${{ secrets.HARMONY_P12_B64 }}
          CER: ${{ secrets.HARMONY_CER_B64 }}
          P7B: ${{ secrets.HARMONY_P7B_B64 }}
          ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          KEY_PW: ${{ secrets.HARMONY_KEY_PASSWORD }}
          STORE_PW: ${{ secrets.HARMONY_STORE_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -z "$P12" ] || [ -z "$CER" ] || [ -z "$P7B" ]; then
            echo "::warning::No signing secrets: publishing an UNSIGNED .hap"; cp "$RUNNER_TEMP/unsigned.hap" ramen-puzzle.hap; echo "signed=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/k.p12"; echo "$CER" | base64 --decode > "$RUNNER_TEMP/c.cer"; echo "$P7B" | base64 --decode > "$RUNNER_TEMP/p.p7b"
          TOOL=$(find "$CLT" -name hap-sign-tool.jar | head -1); echo "sign tool: $TOOL"
          java -jar "$TOOL" sign-app -mode localSign -signAlg SHA256withECDSA -signCode 1 \
            -keyAlias "$ALIAS" -keyPwd "$KEY_PW" -keystoreFile "$RUNNER_TEMP/k.p12" -keystorePwd "$STORE_PW" \
            -appCertFile "$RUNNER_TEMP/c.cer" -profileFile "$RUNNER_TEMP/p.p7b" \
            -inFile "$RUNNER_TEMP/unsigned.hap" -outFile ramen-puzzle.hap
          rm -f "$RUNNER_TEMP/k.p12"
          echo "signed=yes" >> "$GITHUB_OUTPUT"
          ls -la ramen-puzzle.hap

      - name: Publish as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          TAG="harmony-${{ github.run_number }}"
          gh release create "$TAG" ramen-puzzle.hap --title "HarmonyOS build ${{ github.run_number }} (signed: ${{ steps.sign.outputs.signed }})" --notes "HAP built from ${{ github.sha }}; signed: ${{ steps.sign.outputs.signed }}"
