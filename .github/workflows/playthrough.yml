name: Playthrough screenshots

# Plays the game from a blank save through its core loop in headless Chromium (tools/playthrough.cjs): title, town,
# the ramen shop (a customer served, the coin taken), the coffee house (iced coffee, the lucky draw, selling), the library,
# the tower and a church fight, by day and at night. A screenshot after each step, a report of what each step found and
# any page errors are kept as the run's artifact. The run fails if a step fails or the page throws. Manual trigger only.
on:
  workflow_dispatch:

jobs:
  play:
    name: Play through and screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        run: |
          set -eo pipefail
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium

      - name: Play through
        run: node tools/playthrough.cjs playthrough index.html

      - name: Summary
        if: always()
        run: |
          [ -f playthrough/report.md ] && cat playthrough/report.md >> "$GITHUB_STEP_SUMMARY" || echo "no report" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playthrough-${{ github.run_number }}
          path: playthrough/
          retention-days: 30
